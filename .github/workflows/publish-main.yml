name: Publish main packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve stable package version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Validate and export stable package version
        id: resolve
        env:
          GITVERSION_BRANCH: ${{ steps.gitversion.outputs.branchName }}
          PRE_RELEASE_LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
          MAJOR: ${{ steps.gitversion.outputs.major }}
          MINOR: ${{ steps.gitversion.outputs.minor }}
          DISTANCE: ${{ steps.gitversion.outputs.versionSourceDistance }}
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Expected main branch, got ${{ github.ref_name }}." >&2
            exit 1
          fi
          if [ "$GITVERSION_BRANCH" != "main" ]; then
            echo "GitVersion resolved the wrong branch: $GITVERSION_BRANCH" >&2
            exit 1
          fi
          if [ -n "$PRE_RELEASE_LABEL" ]; then
            echo "Main release resolved an unexpected prerelease label: $PRE_RELEASE_LABEL" >&2
            exit 1
          fi
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$DISTANCE" ]; then
            echo "Stable package version could not be determined from GitVersion outputs." >&2
            exit 1
          fi
          PACKAGE_VERSION="$MAJOR.$MINOR.$DISTANCE"
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Stable package version is invalid: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "channel=released" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "SelectedPackageVersion=$PACKAGE_VERSION"

  runtime-packages:
    needs: version
    name: Build ${{ matrix.rid }} self-contained runtime packages
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack AO and SO self-contained runtime packages
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/dotnet/Techne.Loom.AgentOrchestrator.Runtime/Techne.Loom.AgentOrchestrator.Runtime.csproj -c Release -o artifacts/nuget /p:RuntimeIdentifier=${{ matrix.rid }} /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          dotnet pack src/dotnet/Techne.Loom.SkillOrchestrator.Runtime/Techne.Loom.SkillOrchestrator.Runtime.csproj -c Release -o artifacts/nuget /p:RuntimeIdentifier=${{ matrix.rid }} /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          for package_path in artifacts/nuget/*.nupkg; do
            digest="$(sha512sum "$package_path" | awk '{print $1}')"
            printf '%s' "$digest" | xxd -r -p | base64 -w0 > "$package_path.sha512"
          done

      - name: Verify runtime package matrix entry
        run: |
          case "${{ matrix.rid }}" in
            win-*) entry_suffix=".exe" ;;
            *) entry_suffix="" ;;
          esac
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              product_key='ao'
              entry_name="ao$entry_suffix"
            else
              product_key='so'
              entry_name="so$entry_suffix"
            fi
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            test -f "$package_path"
            test -f "$package_path.sha512"
            unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/$entry_name" >/dev/null
            unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/runtime.json" >/dev/null
            docs_prefix="tools/${{ matrix.rid }}/docs/en/"
            guide_path="${docs_prefix}guides/${product_key}-guide.md"
            unzip -Z1 "$package_path" | grep -F "$docs_prefix" >/dev/null
            unzip -Z1 "$package_path" | grep -Fx "$guide_path" >/dev/null
            manifest="$(unzip -p "$package_path" "tools/${{ matrix.rid }}/runtime.json")"
            printf '%s' "$manifest" | grep -F "\"product\": \"$product_key\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"package_id\": \"Techne.Loom.$product.Runtime.${{ matrix.rid }}\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"version\": \"$PACKAGE_VERSION\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"rid\": \"${{ matrix.rid }}\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"entrypoint\": \"$entry_name\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"docs_root\": \"tools/${{ matrix.rid }}/docs/en\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"guide_path\": \"guides/${product_key}-guide.md\"" >/dev/null
            printf '%s' "$manifest" | grep -F '"single_file": true' >/dev/null
          done

      - name: Verify runtime executable format and architecture
        run: |
          case "${{ matrix.rid }}" in
            win-x64) expected_format='PE32\+.*x86-64' ;;
            win-arm64) expected_format='PE32\+.*([Aa]arch64|ARM64)' ;;
            linux-x64|linux-musl-x64) expected_format='ELF 64-bit.*x86-64' ;;
            linux-arm64|linux-musl-arm64) expected_format='ELF 64-bit.*([Aa][Rr][Mm].*aarch64|[Aa]arch64)' ;;
            osx-x64) expected_format='Mach-O 64-bit.*x86_64' ;;
            osx-arm64) expected_format='Mach-O 64-bit.*arm64' ;;
            *) echo "Unsupported matrix RID: ${{ matrix.rid }}" >&2; exit 1 ;;
          esac
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              entry_name='ao'
            else
              entry_name='so'
            fi
            case "${{ matrix.rid }}" in
              win-*) entry_name="$entry_name.exe" ;;
            esac
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            executable_path="$(mktemp)"
            unzip -p "$package_path" "tools/${{ matrix.rid }}/$entry_name" > "$executable_path"
            file_output="$(file -b "$executable_path")"
            echo "${{ matrix.rid }} $product: $file_output"
            printf '%s' "$file_output" | grep -Eq "$expected_format"
            rm -f "$executable_path"
          done

      - name: Smoke test native linux-x64 guide
        if: matrix.rid == 'linux-x64'
        run: |
          set -e -o pipefail
          smoke_root="artifacts/smoke"
          mkdir -p "$smoke_root"
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              entry_name='ao'
            else
              entry_name='so'
            fi
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            package_root="$smoke_root/$product"
            rm -rf "$package_root"
            mkdir -p "$package_root"
            unzip -q "$package_path" -d "$package_root"
            executable_path="$package_root/tools/${{ matrix.rid }}/$entry_name"
            test -f "$executable_path"
            test -d "$package_root/tools/${{ matrix.rid }}/docs/en"
            chmod +x "$executable_path"
            guide_json="$("$executable_path" --guide)"
            printf '%s' "$guide_json" | grep -F "\"version\":\"$PACKAGE_VERSION\"" >/dev/null
            printf '%s' "$guide_json" | grep -Eq '"guide_path":"/.+"'
          done

      - name: Upload runtime package artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packages-${{ matrix.rid }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    needs: [version, runtime-packages]
    name: Publish stable NuGet packages
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    environment: release-main
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build release-set validator
        run: |
          dotnet restore src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj --nologo
          dotnet build src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-restore --nologo

      - name: Validate release set before package restore
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-set
          dotnet run --project src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-build --no-restore -- \
            --repository-root . \
            --manifest release-set.json \
            --channel "$CHANNEL" \
            --authority release \
            --phase pre-publish \
            --candidate-version "$PACKAGE_VERSION" \
            --report artifacts/release-set/pre-publish.json

      - name: Restore
        run: dotnet restore Techne.Loom.sln

      - name: Build
        run: dotnet build Techne.Loom.sln -c Release --no-restore /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION

      - name: Test
        run: dotnet test Techne.Loom.sln -c Release --no-build --nologo

      - name: Download self-contained runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-packages-*
          path: artifacts/nuget
          merge-multiple: true
      - name: Extract published guide sources for target-local refresh
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          set -euo pipefail
          published_root="artifacts/published-docs"
          rm -rf "$published_root"
          mkdir -p "$published_root" docs/en/guides
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              product_key="ao"
              required_pages=("${product_key}-guide-reference-contracts.md" "${product_key}-guide-reference-behavior.md")
            else
              product_key="so"
              required_pages=("${product_key}-guide-reference-contracts.md" "${product_key}-guide-reference-governance.md")
            fi
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.linux-x64.$PACKAGE_VERSION.nupkg"
            test -f "$package_path"
            product_root="$published_root/$product"
            mkdir -p "$product_root"
            unzip -q "$package_path" -d "$product_root"
            guide_root="$product_root/tools/linux-x64/docs/en/guides"
            test -d "$guide_root"
            test -f "$guide_root/${product_key}-guide.md"
            for page in "${required_pages[@]}"; do
              test -f "$guide_root/$page"
            done
            find "$guide_root" -maxdepth 1 -type f -name "${product_key}-guide*.md" -exec cp {} docs/en/guides/ \;
          done
          echo "Target-local refresh sources copied from the exact published runtime packages at $PACKAGE_VERSION."
      - name: Pack
        run: |
          mkdir -p artifacts/nuget
          echo "Packing version: $PACKAGE_VERSION"
          dotnet pack src/dotnet/Techne.Loom.Abstractions/Techne.Loom.Abstractions.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.Common/Techne.Loom.Common.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.AgentOrchestrator/Techne.Loom.AgentOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.SkillOrchestrator/Techne.Loom.SkillOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION

      - name: Validate local 20-package artifact closure
        run: |
          set -euo pipefail
          dotnet run --project src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-build --no-restore -- \
            --repository-root . \
            --manifest release-set.json \
            --channel "$CHANNEL" \
            --authority release \
            --phase pre-publish-package-closure \
            --candidate-version "$PACKAGE_VERSION" \
            --package-root artifacts/nuget \
            --report artifacts/release-set/pre-publish-package-closure.json

      - name: Prepare GitHub release fallback assets
        run: |
          mkdir -p artifacts/github-release
          cp "artifacts/nuget/Techne.Loom.Abstractions.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Abstractions.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.Common.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Common.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.AgentOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.AgentOrchestrator.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.SkillOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.SkillOrchestrator.latest.nupkg"
          for package_path in artifacts/nuget/Techne.Loom.*.Runtime.*.nupkg; do
            package_name="$(basename "$package_path")"
            package_id="${package_name%.$PACKAGE_VERSION.nupkg}"
            cp "$package_path" "artifacts/github-release/$package_id.latest.nupkg"
            cp "$package_path.sha512" "artifacts/github-release/$package_id.latest.nupkg.sha512"
          done
          cat <<EOF > artifacts/github-release/release-notes.md
          Latest stable NuGet fallback assets for Techne Loom.

          Version: $PACKAGE_VERSION
          Branch: main

          This release keeps both exact versioned packages and stable *.latest.nupkg aliases so docs and automation have durable fallback download URLs when NuGet feed access is unavailable.
          EOF

      - name: Publish GitHub release fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nuget-stable-latest --repo "$GITHUB_REPOSITORY" --yes || true
          git push --force origin :refs/tags/nuget-stable-latest || true
          git tag -f nuget-stable-latest
          git push --force origin refs/tags/nuget-stable-latest
          gh release create nuget-stable-latest artifacts/nuget/*.nupkg artifacts/nuget/*.nupkg.sha512 artifacts/github-release/*.nupkg artifacts/github-release/*.nupkg.sha512 --repo "$GITHUB_REPOSITORY" --title "Latest stable NuGet packages ($PACKAGE_VERSION)" --notes-file artifacts/github-release/release-notes.md --latest

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: WaynebabyWang

      - name: Push packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Refresh README release notes
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          export README_MONTH_EN="$(date -u '+%B %Y')"
          export README_YEAR_ZH="$(date -u '+%Y')"
          export README_MONTH_NUMBER_ZH="$(date -u '+%m')"
          python <<'PY'
          import os
          from textwrap import dedent
          from pathlib import Path

          release_start_marker = "<!-- release-notes:start -->"
          release_end_marker = "<!-- release-notes:end -->"
          package_version_start_marker = "<!-- package-version-block:start -->"
          package_version_end_marker = "<!-- package-version-block:end -->"
          package_dotnet_start_marker = "<!-- package-dotnet-block:start -->"
          package_dotnet_end_marker = "<!-- package-dotnet-block:end -->"

          version = os.environ["PACKAGE_VERSION"]
          month_en = os.environ["README_MONTH_EN"]
          month_zh = f'{os.environ["README_YEAR_ZH"]} 年 {int(os.environ["README_MONTH_NUMBER_ZH"])} 月'

          release_blocks = {
              Path("README.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 Release Notes · `v{version}` · {month_en}

                > [!NOTE]
                > **Stable release — synced by publish actions.**
                > Install the latest stable: `dotnet add package Techne.Loom.SkillOrchestrator`
                > Full package list → [`packages.released.md`](packages.released.md)

                ### ✨ Channel Highlights

                | Area | Change |
                | --- | --- |
                | 🔄 **Version sync** | This block is refreshed by the publish workflow so the version shown here matches the latest published stable package set |
                | 📦 **Fallback assets** | GitHub release aliases keep stable `*.latest.nupkg` URLs available when direct NuGet feed access is unavailable |
                | 🔎 **Package discovery** | NuGet.org and [`packages.released.md`](packages.released.md) remain the source of truth for install commands and exact stable version guidance; when an exact package id/version is already known, probe the direct `.nupkg` URL instead of waiting for indexing |

                ### 📦 Packages In This Release

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > This section is updated automatically after each main-branch publish.
                > Check [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator), [`packages.released.md`](packages.released.md), or the [stable fallback release](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest) for latest-version guidance. When the exact package id/version is already known, probe the direct package URL such as `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}` instead of waiting for indexing.

                ### 🔭 Coming Next

                - Stable `so.dll --guide` and `ao.dll --guide` offline guide surfaces with version metadata
                - Explicit public contracts for workflow, control-state, and hint payloads
                - Extend the C#/.NET-first self-contained runtime family to all 8 supported RIDs on stable releases
                - Cleaner AO / SO CLI resume flows with `transition_id` and `correlation_key` examples

                > Node.js and Python remain reserved source roots only; no runnable implementation is committed yet, so their package scaffolding is not part of this roadmap.

                ---
                <!-- release-notes:end -->
                """).lstrip(),
              Path("README.zh-CN.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 发布说明 · `v{version}` · {month_zh}

                > [!NOTE]
                > **稳定版本 — 由发布工作流自动同步。**
                > 安装最新 stable：`dotnet add package Techne.Loom.SkillOrchestrator`
                > 完整包列表 → [`packages.released.zh-CN.md`](packages.released.zh-CN.md)

                ### ✨ 通道亮点

                | 领域 | 变更内容 |
                | --- | --- |
                | 🔄 **版本同步** | 这个区块会由发布工作流重写，确保这里展示的版本号始终对应最新发布的稳定包集合 |
                | 📦 **回退资产** | GitHub release 别名会持续提供稳定的 `*.latest.nupkg` 下载地址，便于 NuGet feed 不可用时回退 |
                | 🔎 **包发现** | NuGet.org 与 [`packages.released.zh-CN.md`](packages.released.zh-CN.md) 仍然是安装命令和精确稳定版本指引的事实来源；当精确 package id/version 已知时，应直接探测 `.nupkg` URL，而不是等待索引刷新 |

                ### 📦 本次发布的包

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > 这个区块会在每次 main 分支发布后自动更新。
                > 请查阅 [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator)、[`packages.released.zh-CN.md`](packages.released.zh-CN.md) 或 [stable 回退发布页](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest) 获取最新版本指引。当精确 package id/version 已知时，应直接探测包地址，例如 `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}`，而不是等待索引刷新。

                ### 🔭 即将推出

                - 带版本元数据的离线 `so.dll --guide` 与 `ao.dll --guide` 指南界面
                - workflow、控制状态与提示负载的显式公共契约
                - 将 C#/.NET-first self-contained runtime 包族扩展到 stable 发布上的全部 8 个 RID
                - 更清晰的 AO / SO CLI resume 流程示例（含 `transition_id` 和 `correlation_key`）

                > Node.js 与 Python 目前仅作为预留 source root；尚未提交可运行的实现，因此它们的包脚手架不在本路线图中。

                ---
                <!-- release-notes:end -->
                """).lstrip(),
          }

          package_version_blocks = {
              Path("packages.released.md"): dedent(f"""
                <!-- package-version-block:start -->
                - The current latest published stable package version is `{version}`.
                - Stable publishing on `main` pushes `major.minor.<distance>` versions to NuGet.org for released packages in this repository policy.
                <!-- package-version-block:end -->
                """).lstrip(),
              Path("packages.released.zh-CN.md"): dedent(f"""
                <!-- package-version-block:start -->
                - 当前最新已发布的稳定包版本是 `{version}`。
                - `main` 分支上的稳定发布会按当前仓库策略把 `major.minor.<distance>` 版本推到 NuGet.org。
                <!-- package-version-block:end -->
                """).lstrip(),
          }

          package_dotnet_blocks = {
              Path("packages.released.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | Role | Package | Stable acquisition | GitHub fallback | Example |
                | --- | --- | --- | --- | --- |
                | Abstractions | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Abstractions.latest.nupkg) | `using Techne.Loom.Abstractions.TaskTracking.Model;` |
                | Common | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Common.latest.nupkg) | `var json = WorkflowJsonSerializer.Serialize(instance);` |
                | Plan execution runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | `ao --guide` from the AO runtime bundle |
                | Skill execution runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | `so --guide` from the SO runtime bundle |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
              Path("packages.released.zh-CN.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | 角色 | 包名 | 稳定获取方式 | GitHub fallback | 示例 |
                | --- | --- | --- | --- | --- |
                | 抽象层 | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Abstractions.latest.nupkg) | `using Techne.Loom.Abstractions.TaskTracking.Model;` |
                | 公共层 | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Common.latest.nupkg) | `var json = WorkflowJsonSerializer.Serialize(instance);` |
                | 计划执行 runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | 使用 AO runtime bundle 运行 `ao --guide` |
                | skill 执行 runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | 使用 SO runtime bundle 运行 `so --guide` |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, start_marker: str, end_marker: str, block: str, path: Path) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in release_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, release_start_marker, release_end_marker, block, path), encoding="utf-8")

          for path, block in package_version_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_version_start_marker, package_version_end_marker, block, path), encoding="utf-8")

          for path, block in package_dotnet_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_dotnet_start_marker, package_dotnet_end_marker, block, path), encoding="utf-8")
          PY

      - name: Refresh skill package version blocks
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          PUBLISHED_DOCS_ROOT: artifacts/published-docs
        run: |
          python <<'PY'
          import os
          import datetime
          import json
          import hashlib
          import re
          from pathlib import Path
          from textwrap import dedent

          version = os.environ["PACKAGE_VERSION"]
          published_docs_root = Path(os.environ["PUBLISHED_DOCS_ROOT"])
          runtime_package_sources = {
              "ao": {
                  "package_id": "Techne.Loom.AgentOrchestrator.Runtime.linux-x64",
                  "docs_root": published_docs_root / "AgentOrchestrator" / "tools" / "linux-x64" / "docs" / "en",
              },
              "so": {
                  "package_id": "Techne.Loom.SkillOrchestrator.Runtime.linux-x64",
                  "docs_root": published_docs_root / "SkillOrchestrator" / "tools" / "linux-x64" / "docs" / "en",
              },
          }
          start_marker = "<!-- skill-package-version-block:start -->"
          end_marker = "<!-- skill-package-version-block:end -->"

          blocks = {
              Path(".agents/skills/loom-plan-execution/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published AO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever AO package versions change, so the skill contract stays aligned with the latest published stable package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
              Path(".agents/skills/loom-skill-enhancement/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published SO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever SO package versions change, so the skill contract stays aligned with the latest published stable package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, path: Path, block: str) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, path, block), encoding="utf-8")

          replacement_targets = {
              Path("packages.released.md"): [
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
              ],
              Path("packages.released.zh-CN.md"): [
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
              ],
              Path(".agents/skills/loom-plan-execution/reference/packages.released.md"): [
                  (r"current latest released version is `[^`]+`", f"current latest released version is `{version}`"),
                  (r"restore the full \.NET runtime bundle \(all members\) at `[^`]+`", f"restore the full .NET runtime bundle (all members) at `{version}`"),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.AgentOrchestrator --version [^\s`]+", f"Techne.Loom.AgentOrchestrator --version {version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
              Path(".agents/skills/loom-skill-enhancement/reference/packages.released.md"): [
                  (r"current latest released version is `[^`]+`", f"current latest released version is `{version}`"),
                  (r"restore the full \.NET runtime bundle \(all members\) at `[^`]+`", f"restore the full .NET runtime bundle (all members) at `{version}`"),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.SkillOrchestrator --version [^\s`]+", f"Techne.Loom.SkillOrchestrator --version {version}"),
                  (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
          }

          for guide_path in Path("docs/en/guides").glob("*-guide*.md"):
              replacement_targets[guide_path] = [
                  (r"(?m)^Version: .+$", f"Version: {version}"),
                  (r"(?m)^Build: .+$", f"Build: published package {version}"),
              ]
          for path, patterns in replacement_targets.items():
              text = path.read_text(encoding="utf-8")
              for pattern, repl in patterns:
                  text = re.sub(pattern, repl, text)
              path.write_text(text, encoding="utf-8")

          def build_reference_copy(source_path, source_reference_path, source_package_id, source_package_path, product, channel, version, title, intro):
              source_content = source_path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
              source_hash = hashlib.sha256(source_content.encode("utf-8")).hexdigest()
              source_content = source_content.rstrip()
              provenance = dedent(f"""
                # {title}

                <!-- loom-document-copy:start -->
                - source_document: `{source_package_path}`
                - source_reference_path: `{source_reference_path.as_posix()}`
                - source_package_id: `{source_package_id}`
                - source_package_rid: `linux-x64`
                - source_product: `{product}`
                - source_channel: `{channel}`
                - source_version: `{version}`
                - source_sha256: `{source_hash}`
                - target_bound_version: `{version}`
                - content_mode: `full-document`
                - artifact_origin: `verified-copy`
                - authority_scope: `target-local context/reference only; the fresh published-runtime guide_path remains authoritative`
                - refresh_policy: `refresh this copy, its manifest, the node map, and the package lock together when the bound {product.upper()} version changes`
                <!-- loom-document-copy:end -->
                """).strip()
              return provenance + "\n\n" + intro + "\n\n" + source_content + "\n", source_hash

          def resolve_package_guide(product, source_file):
              package = runtime_package_sources[product]
              source_path = package["docs_root"] / "guides" / source_file
              if not source_path.is_file():
                  raise RuntimeError(f"Published package guide {source_path} for active {product} is missing.")
              return source_path, package["package_id"], f"tools/linux-x64/docs/en/guides/{source_file}"
          def refresh_version_marker(path, product, version):
              if path is None:
                  return
              text = path.read_text(encoding="utf-8")
              marker = f"- Bound {product.upper()} package runtime version: `{version}`."
              pattern = r"(?m)^- Bound (?:AO|SO) package runtime version: `[^`]+`\.$"
              if re.search(pattern, text):
                  text = re.sub(pattern, marker, text, count=1)
              else:
                  lines = text.splitlines()
                  if not lines:
                      raise RuntimeError(f"Governance note {path} is empty.")
                  lines.insert(1, "")
                  lines.insert(2, marker)
                  text = "\n".join(lines) + "\n"
              path.write_text(text, encoding="utf-8")

          active_skill_assets = {
              "ao": {
                  "skill_root": Path(".agents/skills/loom-plan-execution"),
                  "governance_note": None,
                  "references": {
                      "assets/so-workflow/reference/ao/runtime-contracts.md": {
                          "source_file": "ao-guide-reference-contracts.md",
                          "source_reference": Path("docs/en/guides/ao-guide-reference-contracts.md"),
                          "title": "AO Runtime Contract Reference Copy",
                          "intro": "This target-local file is the complete AO contracts page extracted from the exact published runtime package. It supports this skill but does not replace the fresh package guide returned by `dotnet ao.dll --guide`.",

                      },
                      "assets/so-workflow/reference/ao/runtime-behavior.md": {
                          "source_file": "ao-guide-reference-behavior.md",
                          "source_reference": Path("docs/en/guides/ao-guide-reference-behavior.md"),
                          "title": "AO Runtime Behavior Reference Copy",
                          "intro": "This target-local file is the complete AO behavior page extracted from the exact published runtime package.",

                      },
                  },
              },
              "so": {
                  "skill_root": Path(".agents/skills/loom-skill-enhancement"),
                  "governance_note": Path(".agents/skills/loom-skill-enhancement/assets/so-workflow/governance-notes.md"),
                  "references": {
                      "assets/so-workflow/reference/so/runtime-contracts.md": {
                          "source_file": "so-guide-reference-contracts.md",
                          "source_reference": Path("docs/en/guides/so-guide-reference-contracts.md"),
                          "title": "SO Runtime Contract Reference Copy",
                          "intro": "This target-local file is the complete SO contracts page extracted from the exact published runtime package. It supports this skill but does not replace the fresh package guide returned by `dotnet so.dll --guide`.",

                      },
                      "assets/so-workflow/reference/so/runtime-governance.md": {
                          "source_file": "so-guide-reference-governance.md",
                          "source_reference": Path("docs/en/guides/so-guide-reference-governance.md"),
                          "title": "SO Runtime Governance Reference Copy",
                          "intro": "This target-local file is the complete SO governance page extracted from the exact published runtime package. It is supporting context, not a replacement for the fresh SO guide.",

                      },
                  },
              },
          }
          channel = "released"
          refreshed_by = "publish-main.yml"
          for product, asset in active_skill_assets.items():
              source_by_target = asset["references"]
              manifest_path = asset["skill_root"] / "assets/so-workflow/reference/document-copy-manifest.json"
              manifest_data = json.loads(manifest_path.read_text(encoding="utf-8"))
              manifest_entries = {}
              for entry in manifest_data.get("documents", []):
                  target_relative = entry.get("target_path")
                  if not isinstance(target_relative, str) or target_relative in manifest_entries:
                      raise RuntimeError(f"Active {product} document-copy manifest has an invalid or duplicate target_path.")
                  manifest_entries[target_relative] = entry
              extra_targets = set(manifest_entries) - set(source_by_target)
              if extra_targets:
                  raise RuntimeError(f"Active {product} document-copy manifest has stale target paths: {sorted(extra_targets)}")

              for target_relative, spec in source_by_target.items():
                  normalized_target = target_relative.replace("\\", "/")
                  if normalized_target.startswith("/") or ".." in normalized_target.split("/"):
                      raise RuntimeError(f"Active {product} reference target is unsafe: {target_relative}")
                  source_path, source_package_id, source_package_path = resolve_package_guide(product, spec["source_file"])
                  source_reference_path = spec["source_reference"]
                  target_path = asset["skill_root"] / target_relative
                  target_path.parent.mkdir(parents=True, exist_ok=True)
                  rendered_copy, source_hash = build_reference_copy(
                      source_path,
                      source_reference_path,
                      source_package_id,
                      source_package_path,
                      product,
                      channel,
                      version,
                      spec["title"],
                      spec["intro"],
                  )
                  target_path.write_text(rendered_copy, encoding="utf-8")

                  entry = manifest_entries.setdefault(target_relative, {})
                  entry.pop("source_sections", None)
                  entry.update({
                      "target_path": target_relative,
                      "source_path": source_reference_path.as_posix(),
                      "source_package_id": source_package_id,
                      "source_package_rid": "linux-x64",
                      "source_package_path": source_package_path,
                      "source_product": product,
                      "source_channel": channel,
                      "source_version": version,
                      "source_sha256": source_hash,
                      "content_mode": "full-document",
                      "artifact_origin": entry.get("artifact_origin", "verified-copy"),
                      "authority_scope": entry.get("authority_scope", "target-local full-document context/reference copy; fresh package guide_path is authoritative"),
                      "refreshed_by": refreshed_by,
                  })

              manifest_data["target_bound_product"] = product
              manifest_data["target_bound_channel"] = channel
              manifest_data["target_bound_version"] = version
              manifest_data["refresh_policy"] = f"Refresh documents, manifest, node map, package lock, and skill version block together when the bound {product.upper()} version changes."
              manifest_data["documents"] = [manifest_entries[target_relative] for target_relative in source_by_target]
              manifest_path.write_text(json.dumps(manifest_data, indent=2) + "\n", encoding="utf-8")

              map_path = asset["skill_root"] / "assets/so-workflow/node-to-file-map.md"
              map_text = map_path.read_text(encoding="utf-8")
              version_marker = f"- Bound {product.upper()} package runtime version: `{version}`."
              marker_pattern = r"(?m)^- Bound (?:AO|SO) package runtime version: `[^`]+`\.$"
              if re.search(marker_pattern, map_text):
                  map_text = re.sub(marker_pattern, version_marker, map_text, count=1)
              else:
                  anchor = "Runtime-owned outputs use explicit placeholders and are not checked-in document ownership."
                  if anchor not in map_text:
                      raise RuntimeError(f"Node-to-file map {map_path} is missing its ownership anchor.")
                  map_text = map_text.replace(anchor, anchor + "\n" + version_marker, 1)
              map_path.write_text(map_text, encoding="utf-8")
              refresh_version_marker(asset["governance_note"], product, version)

          for product, asset in active_skill_assets.items():
              lock_path = asset["skill_root"] / "assets/so-workflow/so-package-lock.json"
              lock_data = json.loads(lock_path.read_text(encoding="utf-8"))
              previous_lock = json.loads(json.dumps(lock_data))
              for resolver_owned_key in ("package_id", "channel", "runtime_bundle", "self_contained_runtime_bundle"):
                  lock_data.pop(resolver_owned_key, None)
              lock_data["resolved_version"] = version
              if lock_data != previous_lock:
                  lock_data.setdefault("enhancement", {})["resolved_at_utc"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              lock_path.write_text(json.dumps(lock_data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate release set after surface refresh
        run: |
          set -euo pipefail
          dotnet run --project src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-build --no-restore -- \
            --repository-root . \
            --manifest release-set.json \
            --channel "$CHANNEL" \
            --authority release \
            --phase post-publish \
            --candidate-version "$PACKAGE_VERSION" \
            --package-root artifacts/nuget \
            --report artifacts/release-set/post-publish.json

      - name: Commit release doc and skill version updates
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          git add README.md README.zh-CN.md packages.released.md packages.released.zh-CN.md \
            .agents/skills/loom-plan-execution/SKILL.md \
            .agents/skills/loom-skill-enhancement/SKILL.md \
            .agents/skills/loom-plan-execution/reference/packages.beta.md \
            .agents/skills/loom-plan-execution/reference/packages.released.md \
            .agents/skills/loom-plan-execution/assets/so-workflow/reference/ao \
            .agents/skills/loom-plan-execution/assets/so-workflow/reference/document-copy-manifest.json \
            .agents/skills/loom-plan-execution/assets/so-workflow/node-to-file-map.md \
            .agents/skills/loom-plan-execution/assets/so-workflow/so-package-lock.json \
            .agents/skills/loom-skill-enhancement/reference/packages.beta.md \
            .agents/skills/loom-skill-enhancement/reference/packages.released.md \
            .agents/skills/loom-skill-enhancement/assets/so-workflow/reference/so \
            .agents/skills/loom-skill-enhancement/assets/so-workflow/reference/document-copy-manifest.json \
            .agents/skills/loom-skill-enhancement/assets/so-workflow/node-to-file-map.md \
            .agents/skills/loom-skill-enhancement/assets/so-workflow/governance-notes.md \
            .agents/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json \
            docs/en/guides
          if git diff --cached --quiet; then
            echo "Release note, package index, target-local references, maps, locks, and skill version docs already up to date."
            git reset
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh release docs and skill versions for $PACKAGE_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
