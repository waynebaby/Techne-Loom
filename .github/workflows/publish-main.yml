name: Publish main packages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/en/articles/**'
      - 'docs/zh-cn/articles/**'
      - 'docs/assets/images/**'
      - 'docs/assets/attachments/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techne-loom-package-publish
  cancel-in-progress: false

jobs:
  version:
    name: Resolve stable package version from shared published baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      package_version: ${{ steps.resolve.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine branch metadata
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Resolve monotonic stable package version
        id: resolve
        env:
          GITVERSION_BRANCH: ${{ steps.gitversion.outputs.branchName }}
          PRE_RELEASE_LABEL: ${{ steps.gitversion.outputs.preReleaseLabel }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Expected main branch, got ${{ github.ref_name }}." >&2
            exit 1
          fi
          if [ "$GITVERSION_BRANCH" != "main" ]; then
            echo "GitVersion resolved the wrong branch: $GITVERSION_BRANCH" >&2
            exit 1
          fi
          if [ -n "$PRE_RELEASE_LABEL" ]; then
            echo "Main release resolved an unexpected prerelease label: $PRE_RELEASE_LABEL" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(python "$GITHUB_WORKSPACE/scripts/ResolveSharedPackageVersion.py" \
            --release-set-file "$GITHUB_WORKSPACE/release-set.json" \
            --channel released)"
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Shared stable package version is invalid: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "channel=released" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "SelectedPackageVersion=$PACKAGE_VERSION"

  runtime-packages:
    needs: version
    name: Build ${{ matrix.rid }} self-contained runtime packages
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack unified self-contained Loom runtime package
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          dotnet pack src/dotnet/Techne.Loom.Runtime/Techne.Loom.Runtime.csproj -c Release -o artifacts/nuget /p:RuntimeIdentifier=${{ matrix.rid }} /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          package_path="artifacts/nuget/Techne.Loom.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
          digest="$(sha512sum "$package_path" | awk '{print $1}')"
          printf '%s' "$digest" | xxd -r -p | base64 -w0 > "$package_path.sha512"

      - name: Verify unified Loom runtime package
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            win-*) entry_name="loom.exe" ;;
            *) entry_name="loom" ;;
          esac
          package_id="Techne.Loom.Runtime.${{ matrix.rid }}"
          package_path="artifacts/nuget/$package_id.$PACKAGE_VERSION.nupkg"
          test -f "$package_path"
          test -f "$package_path.sha512"
          unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/$entry_name" >/dev/null
          unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/runtime.json" >/dev/null
          guide_path="tools/${{ matrix.rid }}/docs/en/guides/loom-guide.md"
          unzip -Z1 "$package_path" | grep -Fx "$guide_path" >/dev/null
          manifest="$(unzip -p "$package_path" "tools/${{ matrix.rid }}/runtime.json")"
          printf '%s' "$manifest" | grep -F '"product": "loom"' >/dev/null
          printf '%s' "$manifest" | grep -F "\"package_id\": \"$package_id\"" >/dev/null
          printf '%s' "$manifest" | grep -F "\"version\": \"$PACKAGE_VERSION\"" >/dev/null
          printf '%s' "$manifest" | grep -F "\"rid\": \"${{ matrix.rid }}\"" >/dev/null
          printf '%s' "$manifest" | grep -F "\"entrypoint\": \"$entry_name\"" >/dev/null
          printf '%s' "$manifest" | grep -F "\"docs_root\": \"tools/${{ matrix.rid }}/docs/en\"" >/dev/null
          printf '%s' "$manifest" | grep -F '"guide_path": "guides/loom-guide.md"' >/dev/null
          printf '%s' "$manifest" | grep -F '"single_file": true' >/dev/null

      - name: Verify runtime executable format and architecture
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            win-x64) expected_format='PE32\+.*x86-64' ;;
            win-arm64) expected_format='PE32\+.*([Aa]arch64|ARM64)' ;;
            linux-x64|linux-musl-x64) expected_format='ELF 64-bit.*x86-64' ;;
            linux-arm64|linux-musl-arm64) expected_format='ELF 64-bit.*([Aa][Rr][Mm].*aarch64|[Aa]arch64)' ;;
            osx-x64) expected_format='Mach-O 64-bit.*x86_64' ;;
            osx-arm64) expected_format='Mach-O 64-bit.*arm64' ;;
            *) echo "Unsupported matrix RID: ${{ matrix.rid }}" >&2; exit 1 ;;
          esac
          case "${{ matrix.rid }}" in
            win-*) entry_name='loom.exe' ;;
            *) entry_name='loom' ;;
          esac
          package_path="artifacts/nuget/Techne.Loom.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
          executable_path="$(mktemp)"
          unzip -p "$package_path" "tools/${{ matrix.rid }}/$entry_name" > "$executable_path"
          file_output="$(file -b "$executable_path")"
          echo "${{ matrix.rid }} Loom: $file_output"
          printf '%s' "$file_output" | grep -Eq "$expected_format"
          rm -f "$executable_path"

      - name: Smoke test native linux-x64 guide
        if: matrix.rid == 'linux-x64'
        run: |
          set -e -o pipefail
          smoke_root="artifacts/smoke/loom"
          package_path="artifacts/nuget/Techne.Loom.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
          rm -rf "$smoke_root"
          mkdir -p "$smoke_root"
          unzip -q "$package_path" -d "$smoke_root"
          executable_path="$smoke_root/tools/${{ matrix.rid }}/loom"
          test -f "$executable_path"
          test -d "$smoke_root/tools/${{ matrix.rid }}/docs/en"
          chmod +x "$executable_path"
          guide_json="$("$executable_path" --guide)"
          printf '%s' "$guide_json" | grep -F "\"version\":\"$PACKAGE_VERSION\"" >/dev/null
          printf '%s' "$guide_json" | grep -Eq '"guide_path":"/.+"'

      - name: Upload runtime package artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packages-${{ matrix.rid }}
          path: artifacts/nuget/*
          if-no-files-found: error

  abstractions-package:
    needs: version
    name: Build no-RID Abstractions SDK package
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Pack Abstractions SDK without a runtime identifier
        run: |
          set -euo pipefail
          mkdir -p artifacts/nuget
          dotnet pack src/dotnet/Techne.Loom.Abstractions/Techne.Loom.Abstractions.csproj -c Release -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          package_path="artifacts/nuget/Techne.Loom.Abstractions.$PACKAGE_VERSION.nupkg"
          test -f "$package_path"
          digest="$(sha512sum "$package_path" | awk '{print $1}')"
          printf '%s' "$digest" | xxd -r -p | base64 -w0 > "$package_path.sha512"
          test -f "$package_path.sha512"

      - name: Verify no-RID Abstractions SDK package contents
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          version = os.environ["PACKAGE_VERSION"]
          package_path = Path("artifacts/nuget") / f"Techne.Loom.Abstractions.{version}.nupkg"
          expected_library = "lib/net9.0/Techne.Loom.Abstractions.dll"
          with zipfile.ZipFile(package_path) as package:
              names = set(package.namelist())
              if expected_library not in names:
                  raise SystemExit(f"Missing no-RID SDK assembly: {expected_library}")
              if any(name.startswith(("tools/", "runtimes/", "ref/")) for name in names):
                  raise SystemExit("The Abstractions SDK package must not contain tools, runtimes, or reference assemblies.")
              if any(name.startswith("lib/") and name != expected_library for name in names):
                  raise SystemExit("The Abstractions SDK package contains an unexpected or RID-specific lib payload.")
              nuspecs = [name for name in names if name.endswith(".nuspec")]
              if len(nuspecs) != 1:
                  raise SystemExit(f"Expected exactly one nuspec, found {len(nuspecs)}.")
              allowed = {
                  "[Content_Types].xml",
                  "_rels/.rels",
                  expected_library,
                  nuspecs[0],
                  "README.md",
                  "icon.png",
              }
              unknown = [name for name in names if name not in allowed and not (
                  name.startswith("package/services/metadata/core-properties/") and name.endswith(".psmdcp")
              )]
              if unknown:
                  raise SystemExit(f"Unexpected package payload entries: {unknown}")
              nuspec = ET.fromstring(package.read(nuspecs[0]))
              def child(parent, name):
                  return next((element for element in parent.iter() if element.tag.rsplit("}", 1)[-1] == name), None)
              metadata = child(nuspec, "metadata")
              package_id = child(metadata, "id") if metadata is not None else None
              package_version = child(metadata, "version") if metadata is not None else None
              if package_id is None or package_id.text != "Techne.Loom.Abstractions":
                  raise SystemExit("Abstractions package nuspec ID is incorrect.")
              if package_version is None or package_version.text != version:
                  raise SystemExit("Abstractions package nuspec version is incorrect.")
              dependencies = child(metadata, "dependencies") if metadata is not None else None
              if dependencies is not None and child(dependencies, "dependency") is not None:
                  raise SystemExit("Abstractions SDK package must not declare implementation dependencies.")
          PY

      - name: Prepare external Abstractions SDK consumer project
        run: |
          set -euo pipefail
          consumer_root="artifacts/abstractions-consumer"
          mkdir -p "$consumer_root"
          cat > "$consumer_root/Abstractions.Consumer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net9.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Techne.Loom.Abstractions" Version="$(AbstractionsPackageVersion)" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$consumer_root/Program.cs" <<'EOF'
          using System.Text.Json;
          using Techne.Loom.Abstractions.Ask;
          using Techne.Loom.Abstractions.TaskTracking.Model;
          using Techne.Loom.Common.Runtime;
          using Techne.Loom.Common.TaskTracking.Runtime;

          var contract = new UserInputContract
          {
              QuestionGroups =
              [
                  new UserInputQuestionGroup
                  {
                      Id = "group-1",
                      Questions = [new UserInputQuestion { Id = "question-1", Type = UserInputQuestionTypes.Boolean }],
                  },
              ],
          };
          var roundTrip = JsonSerializer.Deserialize<UserInputContract>(JsonSerializer.Serialize(contract));
          if (roundTrip?.QuestionGroups.Single().Questions.Single().Type != UserInputQuestionTypes.Boolean)
          {
              throw new InvalidOperationException("Abstractions DTO round-trip failed.");
          }

          IStandaloneAskSessionService askService = new ConsumerAskService();
          Console.WriteLine($"{LoomRuntimeProduct.AgentOrchestrator}:{askService.GetType().Name}");

          sealed class ConsumerAskService : IStandaloneAskSessionService
          {
              public Task<AskScopedWorkerEndpoint> StartFromContractFileAsync(
                  string contractFile,
                  CancellationToken ct = default)
                  => throw new NotImplementedException();

              public Task<AskScopedStandaloneResult> GetResultAsync(string askId, CancellationToken ct = default)
                  => throw new NotImplementedException();
          }
          EOF

      - name: Build external consumer against the local Abstractions package
        env:
          NUGET_PACKAGES: ${{ github.workspace }}/artifacts/abstractions-consumer/packages
        run: |
          set -euo pipefail
          dotnet restore artifacts/abstractions-consumer/Abstractions.Consumer.csproj --source artifacts/nuget /p:AbstractionsPackageVersion="$PACKAGE_VERSION" --nologo
          dotnet build artifacts/abstractions-consumer/Abstractions.Consumer.csproj -c Release --no-restore /p:AbstractionsPackageVersion="$PACKAGE_VERSION" --nologo
      - name: Upload Abstractions SDK package artifact
        uses: actions/upload-artifact@v4
        with:
          name: abstractions-package
          path: artifacts/nuget/Techne.Loom.Abstractions.*.nupkg*
          if-no-files-found: error
  publish:
    needs: [version, runtime-packages, abstractions-package]
    name: Publish stable NuGet packages
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      CHANNEL: ${{ needs.version.outputs.channel }}
    environment: release-main
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build release-set validator
        run: |
          dotnet restore src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj --nologo
          dotnet build src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-restore --nologo

      - name: Validate release set before package restore
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-set
          dotnet run --project src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj -c Release --no-build --no-restore -- \
            --repository-root . \
            --manifest release-set.json \
            --channel "$CHANNEL" \
            --authority release \
            --phase pre-publish \
            --candidate-version "$PACKAGE_VERSION" \
            --report artifacts/release-set/pre-publish.json

      - name: Restore
        run: dotnet restore Techne.Loom.sln

      - name: Build
        run: dotnet build Techne.Loom.sln -c Release --no-restore /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION

      - name: Test
        run: dotnet test Techne.Loom.sln -c Release --no-build --nologo

      - name: Download self-contained runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-packages-*
          path: artifacts/nuget
          merge-multiple: true
      - name: Download Abstractions SDK package
        uses: actions/download-artifact@v4
        with:
          pattern: abstractions-package
          path: artifacts/nuget
          merge-multiple: true

      - name: Verify exact 9-package release artifact closure
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import os
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          root = Path("artifacts/nuget")
          version = os.environ["PACKAGE_VERSION"]
          rids = ("win-x64", "win-arm64", "linux-x64", "linux-arm64", "linux-musl-x64", "linux-musl-arm64", "osx-x64", "osx-arm64")
          expected = {f"Techne.Loom.Runtime.{rid}" for rid in rids}
          expected.add("Techne.Loom.Abstractions")
          package_files = {path.name for path in root.glob("*.nupkg")}
          expected_files = {f"{package_id}.{version}.nupkg" for package_id in expected}
          if package_files != expected_files:
              raise SystemExit(f"Expected exactly 9 package files; missing={sorted(expected_files - package_files)}, unexpected={sorted(package_files - expected_files)}")
          for package_id in sorted(expected):
              package_path = root / f"{package_id}.{version}.nupkg"
              sidecar = Path(f"{package_path}.sha512")
              if not sidecar.is_file():
                  raise SystemExit(f"Missing checksum sidecar: {sidecar}")
              actual_hash = hashlib.sha512(package_path.read_bytes()).digest()
              if base64.b64decode(sidecar.read_text(encoding="ascii"), validate=True) != actual_hash:
                  raise SystemExit(f"Checksum sidecar does not match {package_path.name}")
              with zipfile.ZipFile(package_path) as package:
                  nuspecs = [name for name in package.namelist() if name.endswith(".nuspec")]
                  if len(nuspecs) != 1:
                      raise SystemExit(f"Expected exactly one nuspec in {package_path.name}")
                  nuspec = ET.fromstring(package.read(nuspecs[0]))
                  metadata = next((element for element in nuspec.iter() if element.tag.rsplit("}", 1)[-1] == "metadata"), None)
                  def value(name):
                      if metadata is None:
                          return None
                      element = next((item for item in metadata.iter() if item.tag.rsplit("}", 1)[-1] == name), None)
                      return element.text if element is not None else None
                  if value("id") != package_id or value("version") != version:
                      raise SystemExit(f"Incorrect package identity/version in {package_path.name}")
          print("Verified exactly eight unified Loom RID packages and one no-RID Abstractions SDK package, all at the selected version.")
          PY
      - name: Create isolated release refresh workspace
        run: |
          set -euo pipefail
          refresh_root="$GITHUB_WORKSPACE/artifacts/release-refresh"
          echo "RELEASE_REFRESH_ROOT=$refresh_root" >> "$GITHUB_ENV"
          rm -rf "$refresh_root"
          git worktree add --detach "$refresh_root" HEAD
          mkdir -p "$refresh_root/artifacts/nuget"
          cp -a artifacts/nuget/. "$refresh_root/artifacts/nuget/"

      - name: Extract published guide sources for target-local refresh
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          cd "$RELEASE_REFRESH_ROOT"
          set -euo pipefail
          published_root="artifacts/published-docs/loom"
          rm -rf "$published_root"
          mkdir -p "$published_root"
          package_path="artifacts/nuget/Techne.Loom.Runtime.linux-x64.$PACKAGE_VERSION.nupkg"
          test -f "$package_path"
          unzip -q "$package_path" -d "$published_root"
          guide_root="$published_root/tools/linux-x64/docs/en/guides"
          test -d "$guide_root"
          for page in loom-guide.md ao-guide-reference-contracts.md ao-guide-reference-behavior.md so-guide-reference-contracts.md so-guide-reference-governance.md; do
            test -f "$guide_root/$page"
          done
          echo "Target-local refresh sources copied from the exact unified runtime package at $PACKAGE_VERSION."

      - name: Validate local runtime package closure
        run: |
          set -euo pipefail
          cd "$RELEASE_REFRESH_ROOT"
          dotnet run --project "$GITHUB_WORKSPACE/src/dotnet/Techne.Loom.ReleaseSetValidator/Techne.Loom.ReleaseSetValidator.csproj" -c Release --no-build --no-restore -- \
            --repository-root . \
            --manifest release-set.json \
            --channel "$CHANNEL" \
            --authority release \
            --phase pre-publish-package-closure \
            --candidate-version "$PACKAGE_VERSION" \
            --package-root artifacts/nuget \
            --report artifacts/release-set/pre-publish-package-closure.json

      - name: Prepare exact-version GitHub runtime fallback assets
        run: |
          set -euo pipefail
          cd "$RELEASE_REFRESH_ROOT"
          mkdir -p artifacts/github-release
          for package_path in artifacts/nuget/*.nupkg; do
            package_name="$(basename "$package_path")"
            test -f "$package_path.sha512"
            cp "$package_path" "artifacts/github-release/$package_name"
            cp "$package_path.sha512" "artifacts/github-release/$package_name.sha512"
          done
          cat <<EOF > artifacts/github-release/release-notes.md
          Techne Loom exact-version stable packages.

          Version: $PACKAGE_VERSION
          Branch: main
          Scope: eight self-contained Loom RID runtime packages plus one no-RID Abstractions SDK package.
          Every package has a matching .sha512 checksum sidecar. No floating package aliases are published.
          EOF

      - name: Validate NuGet package publication checker syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          ast.parse(Path("scripts/VerifyNuGetPackagePublication.py").read_text(encoding="utf-8"))
          PY

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: WaynebabyWang

      - name: Push packages
        run: |
          cd "$RELEASE_REFRESH_ROOT"
          for package_path in artifacts/nuget/*.nupkg; do
            dotnet nuget push "$package_path" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Verify all exact-version packages on NuGet.org
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: python scripts/VerifyNuGetPackagePublication.py
      - name: Publish GitHub release fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RELEASE_REFRESH_ROOT"
          gh release delete nuget-stable-latest --repo "$GITHUB_REPOSITORY" --yes || true
          git push --force origin :refs/tags/nuget-stable-latest || true
          git tag -f nuget-stable-latest
          git push --force origin refs/tags/nuget-stable-latest
          gh release create nuget-stable-latest artifacts/github-release/*.nupkg artifacts/github-release/*.nupkg.sha512 --repo "$GITHUB_REPOSITORY" --title "Latest stable NuGet packages ($PACKAGE_VERSION)" --notes-file artifacts/github-release/release-notes.md --latest

      - name: Refresh README release notes
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          cd "$RELEASE_REFRESH_ROOT"
          export README_MONTH_EN="$(date -u '+%B %Y')"
          export README_YEAR_ZH="$(date -u '+%Y')"
          export README_MONTH_NUMBER_ZH="$(date -u '+%m')"
          python <<'PY'
          import os
          import re
          from textwrap import dedent
          from pathlib import Path

          release_start_marker = "<!-- release-notes:start -->"
          release_end_marker = "<!-- release-notes:end -->"
          package_version_start_marker = "<!-- package-version-block:start -->"
          package_version_end_marker = "<!-- package-version-block:end -->"
          package_dotnet_start_marker = "<!-- package-dotnet-block:start -->"
          package_dotnet_end_marker = "<!-- package-dotnet-block:end -->"

          version = os.environ["PACKAGE_VERSION"]
          month_en = os.environ["README_MONTH_EN"]
          month_zh = f'{os.environ["README_YEAR_ZH"]} 年 {int(os.environ["README_MONTH_NUMBER_ZH"])} 月'

          rids = ("win-x64", "win-arm64", "linux-x64", "linux-arm64", "linux-musl-x64", "linux-musl-arm64", "osx-x64", "osx-arm64")
          channel = os.environ["CHANNEL"]
          channel_label = "beta" if channel == "beta" else "released"
          release_tag = "nuget-beta-latest" if channel == "beta" else "nuget-stable-latest"
          runtime_package_lines = [f"Techne.Loom.Runtime.{rid} {version}" for rid in rids]
          runtime_package_lines.append(f"Techne.Loom.Abstractions {version}")
          release_blocks = {
              Path("README.md"): "\n".join([
                  "<!-- release-notes:start -->",
                  "---",
                  "",
                  f"## 🚀 Release Notes · `v{version}` · {month_en}",
                  "",
                  f"> **{channel_label} release — synced by publish actions.**",
                  "> Install the single Loom runtime package matching the host RID; verify its `.sha512` sidecar before extraction.",
                  f"> Full package list → [`packages.{channel_label}.md`](packages.{channel_label}.md)",
