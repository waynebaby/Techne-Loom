          def replace_active_version_literals(text: str, pattern: str, version: str) -> str:
              lines = []
              for line in text.splitlines(keepends=True):
                  stripped = line.lstrip().lower()
                  if stripped.startswith("- bad:") or stripped.startswith("bad:"):
                      lines.append(line)
                  else:
                      lines.append(re.sub(pattern, version, line))
              return "".join(lines)

