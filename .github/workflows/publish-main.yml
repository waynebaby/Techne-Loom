name: Publish main packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish stable NuGet packages
    runs-on: ubuntu-latest
    environment: release-main
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Show GitVersion outputs
        run: |
          echo "BranchName=${{ steps.gitversion.outputs.branchName }}"
          echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch=${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "PreReleaseLabel=${{ steps.gitversion.outputs.preReleaseLabel }}"
          echo "VersionSourceDistance=${{ steps.gitversion.outputs.versionSourceDistance }}"

      - name: Validate branch target
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "Expected main branch, got ${{ github.ref_name }}." >&2
            exit 1
          fi

      - name: Select package version
        run: |
          MAJOR="${{ steps.gitversion.outputs.major }}"
          MINOR="${{ steps.gitversion.outputs.minor }}"
          DISTANCE="${{ steps.gitversion.outputs.versionSourceDistance }}"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$DISTANCE" ]; then
            echo "Package version could not be determined from GitVersion outputs." >&2
            exit 1
          fi
          PACKAGE_VERSION="$MAJOR.$MINOR.$DISTANCE"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "SelectedPackageVersion=$PACKAGE_VERSION"

      - name: Validate branch and package version inputs
        run: |
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Stable package version must match <major>.<minor>.<patch>, got $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Techne.Loom.sln

      - name: Build
        run: dotnet build Techne.Loom.sln -c Release --no-restore

      - name: Test
        run: dotnet test Techne.Loom.sln -c Release --no-build --nologo

      - name: Pack
        run: |
          mkdir -p artifacts/nuget
          echo "Packing version: $PACKAGE_VERSION"
          dotnet pack src/dotnet/Techne.Loom.Abstractions/Techne.Loom.Abstractions.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.Common/Techne.Loom.Common.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.AgentOrchestrator/Techne.Loom.AgentOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.SkillOrchestrator/Techne.Loom.SkillOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION

      - name: Prepare GitHub release fallback assets
        run: |
          mkdir -p artifacts/github-release
          cp "artifacts/nuget/Techne.Loom.Abstractions.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Abstractions.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.Common.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Common.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.AgentOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.AgentOrchestrator.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.SkillOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.SkillOrchestrator.latest.nupkg"
          cat <<EOF > artifacts/github-release/release-notes.md
          Latest stable NuGet fallback assets for Techne Loom.

          Version: $PACKAGE_VERSION
          Branch: main

          This release keeps both exact versioned packages and stable *.latest.nupkg aliases so docs and automation have durable fallback download URLs when NuGet feed access is unavailable.
          EOF

      - name: Publish GitHub release fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nuget-stable-latest --repo "$GITHUB_REPOSITORY" --yes || true
          git push --force origin :refs/tags/nuget-stable-latest || true
          git tag -f nuget-stable-latest
          git push --force origin refs/tags/nuget-stable-latest
          gh release create nuget-stable-latest artifacts/nuget/*.nupkg artifacts/github-release/*.nupkg --repo "$GITHUB_REPOSITORY" --title "Latest stable NuGet packages ($PACKAGE_VERSION)" --notes-file artifacts/github-release/release-notes.md --latest

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: WaynebabyWang

      - name: Push packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Refresh README release notes
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          export README_MONTH_EN="$(date -u '+%B %Y')"
          export README_YEAR_ZH="$(date -u '+%Y')"
          export README_MONTH_NUMBER_ZH="$(date -u '+%m')"
          python <<'PY'
          import os
          from textwrap import dedent
          from pathlib import Path

          release_start_marker = "<!-- release-notes:start -->"
          release_end_marker = "<!-- release-notes:end -->"
          package_version_start_marker = "<!-- package-version-block:start -->"
          package_version_end_marker = "<!-- package-version-block:end -->"
          package_dotnet_start_marker = "<!-- package-dotnet-block:start -->"
          package_dotnet_end_marker = "<!-- package-dotnet-block:end -->"

          version = os.environ["PACKAGE_VERSION"]
          month_en = os.environ["README_MONTH_EN"]
          month_zh = f'{os.environ["README_YEAR_ZH"]} 年 {int(os.environ["README_MONTH_NUMBER_ZH"])} 月'

          release_blocks = {
              Path("README.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 Release Notes · `v{version}` · {month_en}

                > [!NOTE]
                > **Stable release — synced by publish actions.**
                > Install the latest stable: `dotnet add package Techne.Loom.SkillOrchestrator`
                > Full package list → [`packages.released.md`](packages.released.md)

                ### ✨ Channel Highlights

                | Area | Change |
                | --- | --- |
                | 🔄 **Version sync** | This block is refreshed by the publish workflow so the version shown here matches the latest published stable package set |
                | 📦 **Fallback assets** | GitHub release aliases keep stable `*.latest.nupkg` URLs available when direct NuGet feed access is unavailable |
                | 🔎 **Package discovery** | NuGet.org and [`packages.released.md`](packages.released.md) remain the source of truth for install commands and exact stable version guidance; when an exact package id/version is already known, probe the direct `.nupkg` URL instead of waiting for indexing |

                ### 📦 Packages In This Release

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > This section is updated automatically after each main-branch publish.
                > Check [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator), [`packages.released.md`](packages.released.md), or the [stable fallback release](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest) for latest-version guidance. When the exact package id/version is already known, probe the direct package URL such as `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}` instead of waiting for indexing.

                ### 🔭 Coming Next

                - Stable `so.dll --guide` and `ao.dll --guide` offline guide surfaces with version metadata
                - Explicit public contracts for workflow, control-state, and hint payloads
                - Node.js and Python package scaffolding alongside the .NET family
                - Cleaner AO / SO CLI resume flows with `transition_id` and `correlation_key` examples

                ---
                <!-- release-notes:end -->
                """).lstrip(),
              Path("README.zh-CN.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 发布说明 · `v{version}` · {month_zh}

                > [!NOTE]
                > **稳定版本 — 由发布工作流自动同步。**
                > 安装最新 stable：`dotnet add package Techne.Loom.SkillOrchestrator`
                > 完整包列表 → [`packages.released.zh-CN.md`](packages.released.zh-CN.md)

                ### ✨ 通道亮点

                | 领域 | 变更内容 |
                | --- | --- |
                | 🔄 **版本同步** | 这个区块会由发布工作流重写，确保这里展示的版本号始终对应最新发布的稳定包集合 |
                | 📦 **回退资产** | GitHub release 别名会持续提供稳定的 `*.latest.nupkg` 下载地址，便于 NuGet feed 不可用时回退 |
                | 🔎 **包发现** | NuGet.org 与 [`packages.released.zh-CN.md`](packages.released.zh-CN.md) 仍然是安装命令和精确稳定版本指引的事实来源；当精确 package id/version 已知时，应直接探测 `.nupkg` URL，而不是等待索引刷新 |

                ### 📦 本次发布的包

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > 这个区块会在每次 main 分支发布后自动更新。
                > 请查阅 [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator)、[`packages.released.zh-CN.md`](packages.released.zh-CN.md) 或 [stable 回退发布页](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest) 获取最新版本指引。当精确 package id/version 已知时，应直接探测包地址，例如 `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}`，而不是等待索引刷新。

                ### 🔭 即将推出

                - 带版本元数据的离线 `so.dll --guide` 与 `ao.dll --guide` 指南界面
                - workflow、控制状态与提示负载的显式公共契约
                - 与 .NET 系列并行的 Node.js 和 Python 包脚手架
                - 更清晰的 AO / SO CLI resume 流程示例（含 `transition_id` 和 `correlation_key`）

                ---
                <!-- release-notes:end -->
                """).lstrip(),
          }

          package_version_blocks = {
              Path("packages.released.md"): dedent(f"""
                <!-- package-version-block:start -->
                - The current latest published stable package version is `{version}`.
                - Stable publishing on `main` pushes `major.minor.<distance>` versions to NuGet.org for released packages in this repository policy.
                <!-- package-version-block:end -->
                """).lstrip(),
              Path("packages.released.zh-CN.md"): dedent(f"""
                <!-- package-version-block:start -->
                - 当前最新已发布的稳定包版本是 `{version}`。
                - `main` 分支上的稳定发布会按当前仓库策略把 `major.minor.<distance>` 版本推到 NuGet.org。
                <!-- package-version-block:end -->
                """).lstrip(),
          }

          package_dotnet_blocks = {
              Path("packages.released.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | Role | Package | Stable acquisition | GitHub fallback | Example |
                | --- | --- | --- | --- | --- |
                | Abstractions | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Abstractions.latest.nupkg) | `using Techne.Loom.Abstractions.TaskTracking.Model;` |
                | Common | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Common.latest.nupkg) | `var json = WorkflowJsonSerializer.Serialize(instance);` |
                | Plan execution runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | `dotnet ao.dll --guide` from the AO runtime bundle |
                | Skill execution runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | `dotnet so.dll --guide` from the SO runtime bundle |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
              Path("packages.released.zh-CN.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | 角色 | 包名 | 稳定获取方式 | GitHub fallback | 示例 |
                | --- | --- | --- | --- | --- |
                | 抽象层 | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Abstractions.latest.nupkg) | `using Techne.Loom.Abstractions.TaskTracking.Model;` |
                | 公共层 | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.Common.latest.nupkg) | `var json = WorkflowJsonSerializer.Serialize(instance);` |
                | 计划执行 runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | 使用 AO runtime bundle 运行 `dotnet ao.dll --guide` |
                | skill 执行 runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | 使用 SO runtime bundle 运行 `dotnet so.dll --guide` |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, start_marker: str, end_marker: str, block: str, path: Path) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in release_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, release_start_marker, release_end_marker, block, path), encoding="utf-8")

          for path, block in package_version_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_version_start_marker, package_version_end_marker, block, path), encoding="utf-8")

          for path, block in package_dotnet_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_dotnet_start_marker, package_dotnet_end_marker, block, path), encoding="utf-8")
          PY

      - name: Refresh skill package version blocks
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          python <<'PY'
          import os
          import datetime
          import json
          import re
          from pathlib import Path
          from textwrap import dedent

          version = os.environ["PACKAGE_VERSION"]
          start_marker = "<!-- skill-package-version-block:start -->"
          end_marker = "<!-- skill-package-version-block:end -->"

          blocks = {
              Path(".github/skills/loom-plan-execution/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published AO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever AO package versions change, so the skill contract stays aligned with the latest published stable package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
              Path(".github/skills/loom-skill-enhancement/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published SO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever SO package versions change, so the skill contract stays aligned with the latest published stable package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, path: Path, block: str) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, path, block), encoding="utf-8")

          replacement_targets = {
              Path(".github/skills/loom-plan-execution/reference/packages.released.md"): [
                  (r"current latest released version is `[^`]+`", f"current latest released version is `{version}`"),
                  (r"restore all three packages at `[^`]+`", f"restore all three packages at `{version}`"),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.AgentOrchestrator --version [^\s`]+", f"Techne.Loom.AgentOrchestrator --version {version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
              Path(".github/skills/loom-plan-execution/reference/ao-guide.released.md"): [
                  (r"Current latest released AO bundle version for this offline snapshot: `[^`]+`", f"Current latest released AO bundle version for this offline snapshot: `{version}`"),
                  (r"Restore the full AO runtime bundle at `[^`]+`", f"Restore the full AO runtime bundle at `{version}`"),
              ],
              Path(".github/skills/loom-skill-enhancement/reference/packages.released.md"): [
                  (r"current latest released version is `[^`]+`", f"current latest released version is `{version}`"),
                  (r"restore all three packages at `[^`]+`", f"restore all three packages at `{version}`"),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.SkillOrchestrator --version [^\s`]+", f"Techne.Loom.SkillOrchestrator --version {version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
              Path(".github/skills/loom-skill-enhancement/reference/so-guide.released.md"): [
                  (r"Current latest released SO bundle version for this offline snapshot: `[^`]+`", f"Current latest released SO bundle version for this offline snapshot: `{version}`"),
                  (r"Restore the full SO runtime bundle at `[^`]+`", f"Restore the full SO runtime bundle at `{version}`"),
              ],
          }

          for path, patterns in replacement_targets.items():
              text = path.read_text(encoding="utf-8")
              for pattern, repl in patterns:
                  text = re.sub(pattern, repl, text)
              path.write_text(text, encoding="utf-8")

          lock_path = Path(".github/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json")
          lock_data = json.loads(lock_path.read_text(encoding="utf-8"))
          lock_data["channel"] = "released"
          lock_data["resolved_version"] = version
          for item in lock_data.get("runtime_bundle", []):
              item["resolved_version"] = version
          lock_data.setdefault("enhancement", {})["resolved_at_utc"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          lock_path.write_text(json.dumps(lock_data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit release doc and skill version updates
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          if git diff --quiet -- README.md README.zh-CN.md packages.released.md packages.released.zh-CN.md .github/skills/loom-plan-execution/SKILL.md .github/skills/loom-skill-enhancement/SKILL.md .github/skills/loom-plan-execution/reference/packages.released.md .github/skills/loom-plan-execution/reference/ao-guide.released.md .github/skills/loom-skill-enhancement/reference/packages.released.md .github/skills/loom-skill-enhancement/reference/so-guide.released.md .github/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json; then
            echo "Release note, package index, and skill version docs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md packages.released.md packages.released.zh-CN.md .github/skills/loom-plan-execution/SKILL.md .github/skills/loom-skill-enhancement/SKILL.md .github/skills/loom-plan-execution/reference/packages.released.md .github/skills/loom-plan-execution/reference/ao-guide.released.md .github/skills/loom-skill-enhancement/reference/packages.released.md .github/skills/loom-skill-enhancement/reference/so-guide.released.md .github/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json
          git commit -m "docs: refresh release docs and skill versions for $PACKAGE_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
