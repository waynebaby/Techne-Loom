name: Publish development packages

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-packages:
    name: Build ${{ matrix.rid }} self-contained runtime packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Validate branch target
        run: |
          if [ "${{ github.ref_name }}" != "development" ]; then
            echo "Expected development branch, got ${{ github.ref_name }}." >&2
            exit 1
          fi

      - name: Select package version
        run: |
          PACKAGE_VERSION="${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}.${{ steps.gitversion.outputs.versionSourceDistance }}-beta"
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta$'; then
            echo "Beta runtime package version is invalid: $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Pack AO and SO self-contained runtime packages
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/dotnet/Techne.Loom.AgentOrchestrator.Runtime/Techne.Loom.AgentOrchestrator.Runtime.csproj -c Release -o artifacts/nuget /p:RuntimeIdentifier=${{ matrix.rid }} /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          dotnet pack src/dotnet/Techne.Loom.SkillOrchestrator.Runtime/Techne.Loom.SkillOrchestrator.Runtime.csproj -c Release -o artifacts/nuget /p:RuntimeIdentifier=${{ matrix.rid }} /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION --nologo
          for package_path in artifacts/nuget/*.nupkg; do
            digest="$(sha512sum "$package_path" | awk '{print $1}')"
            printf '%s' "$digest" | xxd -r -p | base64 -w0 > "$package_path.sha512"
          done

      - name: Verify runtime package matrix entry
        run: |
          case "${{ matrix.rid }}" in
            win-*) entry_suffix=".exe" ;;
            *) entry_suffix="" ;;
          esac
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              product_key='ao'
              entry_name="ao$entry_suffix"
            else
              product_key='so'
              entry_name="so$entry_suffix"
            fi
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            test -f "$package_path"
            test -f "$package_path.sha512"
            unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/$entry_name" >/dev/null
            unzip -Z1 "$package_path" | grep -Fx "tools/${{ matrix.rid }}/runtime.json" >/dev/null
            docs_prefix="tools/${{ matrix.rid }}/docs/en/"
            guide_path="${docs_prefix}reference/products/${product_key}-guide.md"
            unzip -Z1 "$package_path" | grep -F "$docs_prefix" >/dev/null
            unzip -Z1 "$package_path" | grep -Fx "$guide_path" >/dev/null
            manifest="$(unzip -p "$package_path" "tools/${{ matrix.rid }}/runtime.json")"
            printf '%s' "$manifest" | grep -F "\"product\": \"$product_key\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"package_id\": \"Techne.Loom.$product.Runtime.${{ matrix.rid }}\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"version\": \"$PACKAGE_VERSION\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"rid\": \"${{ matrix.rid }}\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"entrypoint\": \"$entry_name\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"docs_root\": \"tools/${{ matrix.rid }}/docs/en\"" >/dev/null
            printf '%s' "$manifest" | grep -F "\"guide_path\": \"reference/products/${product_key}-guide.md\"" >/dev/null
            printf '%s' "$manifest" | grep -F '"single_file": true' >/dev/null
          done

      - name: Verify runtime executable format and architecture
        run: |
          case "${{ matrix.rid }}" in
            win-x64) expected_format='PE32\+.*x86-64' ;;
            win-arm64) expected_format='PE32\+.*([Aa]arch64|ARM64)' ;;
            linux-x64|linux-musl-x64) expected_format='ELF 64-bit.*x86-64' ;;
            linux-arm64|linux-musl-arm64) expected_format='ELF 64-bit.*([Aa][Rr][Mm].*aarch64|[Aa]arch64)' ;;
            osx-x64) expected_format='Mach-O 64-bit.*x86_64' ;;
            osx-arm64) expected_format='Mach-O 64-bit.*arm64' ;;
            *) echo "Unsupported matrix RID: ${{ matrix.rid }}" >&2; exit 1 ;;
          esac
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              entry_name='ao'
            else
              entry_name='so'
            fi
            case "${{ matrix.rid }}" in
              win-*) entry_name="$entry_name.exe" ;;
            esac
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            executable_path="$(mktemp)"
            unzip -p "$package_path" "tools/${{ matrix.rid }}/$entry_name" > "$executable_path"
            file_output="$(file -b "$executable_path")"
            echo "${{ matrix.rid }} $product: $file_output"
            printf '%s' "$file_output" | grep -Eq "$expected_format"
            rm -f "$executable_path"
          done

      - name: Smoke test native linux-x64 guide
        if: matrix.rid == 'linux-x64'
        run: |
          mkdir -p artifacts/smoke
          for product in AgentOrchestrator SkillOrchestrator; do
            if [ "$product" = "AgentOrchestrator" ]; then
              entry_name='ao'
            else
              entry_name='so'
            fi
            package_path="artifacts/nuget/Techne.Loom.$product.Runtime.${{ matrix.rid }}.$PACKAGE_VERSION.nupkg"
            executable_path="artifacts/smoke/$entry_name"
            unzip -p "$package_path" "tools/${{ matrix.rid }}/$entry_name" > "$executable_path"
            chmod +x "$executable_path"
            guide_json="$("$executable_path" --guide)"
            printf '%s' "$guide_json" | grep -F "\"version\":\"$PACKAGE_VERSION\"" >/dev/null
            printf '%s' "$guide_json" | grep -Eq '"guide_path":"/.+"'
          done

      - name: Upload runtime package artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packages-${{ matrix.rid }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    needs: runtime-packages
    name: Publish prerelease NuGet packages
    runs-on: ubuntu-latest
    environment: release-development
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: 6.7.x

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Show GitVersion outputs
        run: |
          echo "BranchName=${{ steps.gitversion.outputs.branchName }}"
          echo "SemVer=${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer=${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch=${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "PreReleaseLabel=${{ steps.gitversion.outputs.preReleaseLabel }}"
          echo "VersionSourceDistance=${{ steps.gitversion.outputs.versionSourceDistance }}"

      - name: Validate branch target
        run: |
          if [ "${{ github.ref_name }}" != "development" ]; then
            echo "Expected development branch, got ${{ github.ref_name }}." >&2
            exit 1
          fi

      - name: Select package version
        run: |
          MAJOR="${{ steps.gitversion.outputs.major }}"
          MINOR="${{ steps.gitversion.outputs.minor }}"
          DISTANCE="${{ steps.gitversion.outputs.versionSourceDistance }}"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$DISTANCE" ]; then
            echo "Package version could not be determined from GitVersion outputs." >&2
            exit 1
          fi
          PACKAGE_VERSION="$MAJOR.$MINOR.$DISTANCE-beta"
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "SelectedPackageVersion=$PACKAGE_VERSION"

      - name: Validate branch and package version inputs
        run: |
          if ! printf '%s' "$PACKAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta$'; then
            echo "Development package version must match <major>.<minor>.<patch>-beta, got $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Techne.Loom.sln

      - name: Build
        run: dotnet build Techne.Loom.sln -c Release --no-restore /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION /p:InformationalVersion=$PACKAGE_VERSION

      - name: Test
        run: dotnet test Techne.Loom.sln -c Release --no-build --nologo

      - name: Download self-contained runtime packages
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-packages-*
          path: artifacts/nuget
          merge-multiple: true

      - name: Pack
        run: |
          mkdir -p artifacts/nuget
          echo "Packing version: $PACKAGE_VERSION"
          dotnet pack src/dotnet/Techne.Loom.Abstractions/Techne.Loom.Abstractions.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.Common/Techne.Loom.Common.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.AgentOrchestrator/Techne.Loom.AgentOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION
          dotnet pack src/dotnet/Techne.Loom.SkillOrchestrator/Techne.Loom.SkillOrchestrator.csproj -c Release --no-build -o artifacts/nuget /p:Version=$PACKAGE_VERSION /p:PackageVersion=$PACKAGE_VERSION

      - name: Prepare GitHub release fallback assets
        run: |
          mkdir -p artifacts/github-release
          cp "artifacts/nuget/Techne.Loom.Abstractions.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Abstractions.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.Common.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.Common.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.AgentOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.AgentOrchestrator.latest.nupkg"
          cp "artifacts/nuget/Techne.Loom.SkillOrchestrator.$PACKAGE_VERSION.nupkg" "artifacts/github-release/Techne.Loom.SkillOrchestrator.latest.nupkg"
          for package_path in artifacts/nuget/Techne.Loom.*.Runtime.*.nupkg; do
            package_name="$(basename "$package_path")"
            package_id="${package_name%.$PACKAGE_VERSION.nupkg}"
            cp "$package_path" "artifacts/github-release/$package_id.latest.nupkg"
            cp "$package_path.sha512" "artifacts/github-release/$package_id.latest.nupkg.sha512"
          done
          cat <<EOF > artifacts/github-release/release-notes.md
          Latest beta NuGet fallback assets for Techne Loom.

          Version: $PACKAGE_VERSION
          Branch: development

          This release keeps both exact prerelease packages and stable *.latest.nupkg aliases so docs and automation have durable fallback download URLs when NuGet feed access is unavailable.

          Expected stable release addresses after merge to main:
          https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest
          https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.<exact-version>.nupkg
          https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.latest.nupkg
          EOF

      - name: Publish GitHub release fallback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nuget-beta-latest --repo "$GITHUB_REPOSITORY" --yes || true
          git push --force origin :refs/tags/nuget-beta-latest || true
          git tag -f nuget-beta-latest
          git push --force origin refs/tags/nuget-beta-latest
          gh release create nuget-beta-latest artifacts/nuget/*.nupkg artifacts/nuget/*.nupkg.sha512 artifacts/github-release/*.nupkg artifacts/github-release/*.nupkg.sha512 --repo "$GITHUB_REPOSITORY" --title "Latest beta NuGet packages ($PACKAGE_VERSION)" --notes-file artifacts/github-release/release-notes.md --prerelease

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: WaynebabyWang

      - name: Push packages
        run: dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Refresh README release notes
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          export README_MONTH_EN="$(date -u '+%B %Y')"
          export README_YEAR_ZH="$(date -u '+%Y')"
          export README_MONTH_NUMBER_ZH="$(date -u '+%m')"
          python <<'PY'
          import os
          from textwrap import dedent
          from pathlib import Path

          release_start_marker = "<!-- release-notes:start -->"
          release_end_marker = "<!-- release-notes:end -->"
          package_version_start_marker = "<!-- package-version-block:start -->"
          package_version_end_marker = "<!-- package-version-block:end -->"
          package_dotnet_start_marker = "<!-- package-dotnet-block:start -->"
          package_dotnet_end_marker = "<!-- package-dotnet-block:end -->"

          version = os.environ["PACKAGE_VERSION"]
          month_en = os.environ["README_MONTH_EN"]
          month_zh = f'{os.environ["README_YEAR_ZH"]} 年 {int(os.environ["README_MONTH_NUMBER_ZH"])} 月'

          release_blocks = {
              Path("README.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 Release Notes · `v{version}` · {month_en}

                > [!NOTE]
                > **Development pre-release — synced by publish actions.**
                > Install the latest beta: `dotnet add package Techne.Loom.SkillOrchestrator --prerelease`
                > Full package list → [`packages.beta.md`](packages.beta.md)

                ### ✨ Channel Highlights

                | Area | Change |
                | --- | --- |
                | 🔄 **Version sync** | This block is refreshed by the publish workflow so the version shown here matches the latest published beta package set |
                | 📦 **Fallback assets** | GitHub release aliases keep stable `*.latest.nupkg` URLs available when direct NuGet feed access is unavailable |
                | 🔎 **Package discovery** | NuGet.org and [`packages.beta.md`](packages.beta.md) remain the source of truth for install commands and exact prerelease guidance; when an exact package id/version is already known, probe the direct `.nupkg` URL instead of waiting for indexing |

                ### 📦 Packages In This Release

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > This section is updated automatically after each development publish.
                > Check [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator), [`packages.beta.md`](packages.beta.md), or the [beta fallback release](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-beta-latest) for latest-version guidance. When the exact package id/version is already known, probe the direct package URL such as `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}` instead of waiting for indexing.
                > Expected stable addresses after merge to `main`: [stable fallback release](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest), exact asset `https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.<exact-version>.nupkg`, and durable alias `https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.latest.nupkg`.

                ### 🔭 Coming Next

                - Stable `so.dll --guide` and `ao.dll --guide` offline guide surfaces with version metadata
                - Explicit public contracts for workflow, control-state, and hint payloads
                - Extend the C#/.NET-first self-contained runtime family to all 8 supported RIDs on stable releases
                - Cleaner AO / SO CLI resume flows with `transition_id` and `correlation_key` examples

                > Node.js and Python remain reserved source roots only; no runnable implementation is committed yet, so their package scaffolding is not part of this roadmap.

                ---
                <!-- release-notes:end -->
                """).lstrip(),
              Path("README.zh-CN.md"): dedent(f"""
                <!-- release-notes:start -->
                ---

                ## 🚀 发布说明 · `v{version}` · {month_zh}

                > [!NOTE]
                > **开发预发布版本 — 由发布工作流自动同步。**
                > 安装最新 beta：`dotnet add package Techne.Loom.SkillOrchestrator --prerelease`
                > 完整包列表 → [`packages.beta.zh-CN.md`](packages.beta.zh-CN.md)

                ### ✨ 通道亮点

                | 领域 | 变更内容 |
                | --- | --- |
                | 🔄 **版本同步** | 这个区块会由发布工作流重写，确保这里展示的版本号始终对应最新发布的 beta 包集合 |
                | 📦 **回退资产** | GitHub release 别名会持续提供稳定的 `*.latest.nupkg` 下载地址，便于 NuGet feed 不可用时回退 |
                | 🔎 **包发现** | NuGet.org 与 [`packages.beta.zh-CN.md`](packages.beta.zh-CN.md) 仍然是安装命令和精确预发布版本指引的事实来源；当精确 package id/version 已知时，应直接探测 `.nupkg` URL，而不是等待索引刷新 |

                ### 📦 本次发布的包

                ```text
                Techne.Loom.Abstractions          {version}
                Techne.Loom.Common                {version}
                Techne.Loom.AgentOrchestrator     {version}
                Techne.Loom.SkillOrchestrator     {version}
                ```

                > 这个区块会在每次 development 通道发布后自动更新。
                > 请查阅 [NuGet.org](https://www.nuget.org/packages/Techne.Loom.SkillOrchestrator)、[`packages.beta.zh-CN.md`](packages.beta.zh-CN.md) 或 [beta 回退发布页](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-beta-latest) 获取最新版本指引。当精确 package id/version 已知时，应直接探测包地址，例如 `https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}`，而不是等待索引刷新。
                > 合并到 `main` 后的预期 stable 地址： [stable fallback release](https://github.com/waynebaby/Techne-Loom/releases/tag/nuget-stable-latest)、精确 asset `https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.<exact-version>.nupkg`，以及稳定别名 `https://github.com/waynebaby/Techne-Loom/releases/download/nuget-stable-latest/<PackageId>.latest.nupkg`。

                ### 🔭 即将推出

                - 带版本元数据的离线 `so.dll --guide` 与 `ao.dll --guide` 指南界面
                - workflow、控制状态与提示负载的显式公共契约
                - 将 C#/.NET-first self-contained runtime 包族扩展到 stable 发布上的全部 8 个 RID
                - 更清晰的 AO / SO CLI resume 流程示例（含 `transition_id` 和 `correlation_key`）

                > Node.js 与 Python 目前仅作为预留 source root；尚未提交可运行的实现，因此它们的包脚手架不在本路线图中。

                ---
                <!-- release-notes:end -->
                """).lstrip(),
          }

          package_version_blocks = {
              Path("packages.beta.md"): dedent(f"""
                <!-- package-version-block:start -->
                - The current latest published beta package version is `{version}`.
                - Development publishing on `development` pushes `major.minor.<distance>-beta` versions to NuGet.org, where `<distance>` is the GitVersion commit distance from the current version source.
                <!-- package-version-block:end -->
                """).lstrip(),
              Path("packages.beta.zh-CN.md"): dedent(f"""
                <!-- package-version-block:start -->
                - 当前最新已发布的 beta 包版本是 `{version}`。
                - `development` 分支上的 beta 发布会把 `major.minor.<distance>-beta` 版本推到 NuGet.org，其中 `<distance>` 表示 GitVersion 相对当前版本源的提交距离。
                <!-- package-version-block:end -->
                """).lstrip(),
          }

          package_dotnet_blocks = {
              Path("packages.beta.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | Role | Package / source | Beta acquisition | GitHub fallback | Example |
                | --- | --- | --- | --- | --- |
                | Abstractions | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.Abstractions.latest.nupkg) | consume exact latest prerelease |
                | Common | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.Common.latest.nupkg) | consume exact latest prerelease |
                | Plan execution runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | use exact latest prerelease AO runtime bundle |
                | Skill execution runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}` plus restore `Techne.Loom.Common` and `Techne.Loom.Abstractions` at `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | use exact latest prerelease SO runtime bundle |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
              Path("packages.beta.zh-CN.md"): dedent(f"""
                <!-- package-dotnet-block:start -->
                | 角色 | 包 / 源 | Beta 获取方式 | GitHub fallback | 示例 |
                | --- | --- | --- | --- | --- |
                | 抽象层 | `Techne.Loom.Abstractions` | `dotnet add package Techne.Loom.Abstractions --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.Abstractions.latest.nupkg) | 使用精确最新 prerelease |
                | 公共层 | `Techne.Loom.Common` | `dotnet add package Techne.Loom.Common --version {version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.Common.latest.nupkg) | 使用精确最新 prerelease |
                | 计划执行 runtime | `Techne.Loom.AgentOrchestrator` | `dotnet add package Techne.Loom.AgentOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.AgentOrchestrator.latest.nupkg) | 使用精确最新 prerelease AO runtime bundle |
                | skill 执行 runtime | `Techne.Loom.SkillOrchestrator` | `dotnet add package Techne.Loom.SkillOrchestrator --version {version}`，并同时恢复 `Techne.Loom.Common` 与 `Techne.Loom.Abstractions` 的 `{version}` | [latest .nupkg](https://github.com/waynebaby/Techne-Loom/releases/download/nuget-beta-latest/Techne.Loom.SkillOrchestrator.latest.nupkg) | 使用精确最新 prerelease SO runtime bundle |
                <!-- package-dotnet-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, start_marker: str, end_marker: str, block: str, path: Path) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in release_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, release_start_marker, release_end_marker, block, path), encoding="utf-8")

          for path, block in package_version_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_version_start_marker, package_version_end_marker, block, path), encoding="utf-8")

          for path, block in package_dotnet_blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, package_dotnet_start_marker, package_dotnet_end_marker, block, path), encoding="utf-8")
          PY

      - name: Refresh skill package version blocks
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          python <<'PY'
          import os
          import datetime
          import json
          import re
          from pathlib import Path
          from textwrap import dedent

          version = os.environ["PACKAGE_VERSION"]
          start_marker = "<!-- skill-package-version-block:start -->"
          end_marker = "<!-- skill-package-version-block:end -->"

          blocks = {
              Path(".agents/skills/loom-plan-execution/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published AO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever AO package versions change, so the skill contract stays aligned with the latest published beta package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
              Path(".agents/skills/loom-skill-enhancement/SKILL.md"): dedent(f"""
                <!-- skill-package-version-block:start -->
                - Current published SO package runtime version: `{version}`.
                - This block is refreshed by the publish workflows whenever SO package versions change, so the skill contract stays aligned with the latest published beta package set.
                <!-- skill-package-version-block:end -->
                """).lstrip(),
          }

          def replace_block(text: str, path: Path, block: str) -> str:
              start = text.find(start_marker)
              end = text.find(end_marker)
              if start == -1 or end == -1:
                  raise RuntimeError(f"Could not find markers {start_marker} / {end_marker} in {path}.")
              end += len(end_marker)
              return text[:start] + block + text[end:]

          for path, block in blocks.items():
              text = path.read_text(encoding="utf-8")
              path.write_text(replace_block(text, path, block), encoding="utf-8")

          replacement_targets = {
              Path("packages.beta.md"): [
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
              ],
              Path("packages.beta.zh-CN.md"): [
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
              ],
              Path(".agents/skills/loom-plan-execution/reference/packages.beta.md"): [
                  (r"current latest beta version is `[^`]+`", f"current latest beta version is `{version}`"),
                  (r"restore the full \.NET runtime bundle \(all members\) at `[^`]+`", f"restore the full .NET runtime bundle (all members) at `{version}`"),
                (r"current bound version `[^`]+`", f"current bound version `{version}`"),
                  (r"another at a different prerelease\.", "another at a different prerelease."),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.AgentOrchestrator --version [^\s`]+", f"Techne.Loom.AgentOrchestrator --version {version}"),
                (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.AgentOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.AgentOrchestrator/{version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
              Path(".agents/skills/loom-skill-enhancement/reference/packages.beta.md"): [
                  (r"current latest beta version is `[^`]+`", f"current latest beta version is `{version}`"),
                  (r"restore the full \.NET runtime bundle \(all members\) at `[^`]+`", f"restore the full .NET runtime bundle (all members) at `{version}`"),
                  (r"current bound version `[^`]+`", f"current bound version `{version}`"),
                  (r"Techne\.Loom\.Abstractions --version [^\s`]+", f"Techne.Loom.Abstractions --version {version}"),
                  (r"Techne\.Loom\.Common --version [^\s`]+", f"Techne.Loom.Common --version {version}"),
                  (r"Techne\.Loom\.SkillOrchestrator --version [^\s`]+", f"Techne.Loom.SkillOrchestrator --version {version}"),
                  (r"https://www\.nuget\.org/api/v2/package/Techne\.Loom\.SkillOrchestrator/[^\s`]+", f"https://www.nuget.org/api/v2/package/Techne.Loom.SkillOrchestrator/{version}"),
                  (r"resolved_runtime_version: [^`\n]+", f"resolved_runtime_version: {version}"),
              ],
          }

          for guide_path in Path("docs/en/guides").glob("*-guide*.md"):
              replacement_targets[guide_path] = [
                  (r"Version: draft", f"Version: {version}"),
                  (r"Build: repository source", f"Build: published package {version}"),
              ]
          for path, patterns in replacement_targets.items():
              text = path.read_text(encoding="utf-8")
              for pattern, repl in patterns:
                  text = re.sub(pattern, repl, text)
              path.write_text(text, encoding="utf-8")

          for lock_path in (
              Path(".agents/skills/loom-plan-execution/assets/so-workflow/so-package-lock.json"),
              Path(".agents/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json"),
          ):
              lock_data = json.loads(lock_path.read_text(encoding="utf-8"))

              lock_data["resolved_version"] = version
              for bundle_name in ("runtime_bundle", "self_contained_runtime_bundle"):
                  for item in lock_data.get(bundle_name, []):
                      item["resolved_version"] = version
              lock_data.setdefault("enhancement", {})["resolved_at_utc"] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
              lock_path.write_text(json.dumps(lock_data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit release doc and skill version updates
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        run: |
          if git diff --quiet -- README.md README.zh-CN.md packages.beta.md packages.beta.zh-CN.md .agents/skills/loom-plan-execution/SKILL.md .agents/skills/loom-skill-enhancement/SKILL.md .agents/skills/loom-plan-execution/reference/packages.beta.md docs/en/guides .agents/skills/loom-skill-enhancement/reference/packages.beta.md .agents/skills/loom-plan-execution/assets/so-workflow/so-package-lock.json .agents/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json; then
            echo "Release note, package index, and skill version docs already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md packages.beta.md packages.beta.zh-CN.md .agents/skills/loom-plan-execution/SKILL.md .agents/skills/loom-skill-enhancement/SKILL.md .agents/skills/loom-plan-execution/reference/packages.beta.md docs/en/guides .agents/skills/loom-skill-enhancement/reference/packages.beta.md .agents/skills/loom-plan-execution/assets/so-workflow/so-package-lock.json .agents/skills/loom-skill-enhancement/assets/so-workflow/so-package-lock.json
          git commit -m "docs: refresh release docs and skill versions for $PACKAGE_VERSION [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
